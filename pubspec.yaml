name: foodgo
description: FoodGo - Modern Food Delivery Application built with Flutter and Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.10

  # State Management
  provider: ^6.1.1

  # UI
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  flutter_rating_bar: ^4.0.1
  intl: ^0.19.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^3.1.0

  # Utilities
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  url_launcher: ^6.2.4
  permission_handler: ^11.3.0
  connectivity_plus: ^6.0.3
  pinput: ^4.0.0
  country_code_picker: ^3.0.0
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
